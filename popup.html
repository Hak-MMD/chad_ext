    <div id="welcome-screen" class="welcome-screen">
      <div class="welcome-card">
        <img src="icons/icon.png" class="welcome-logo" alt="ChadAI Logo" />

        <h1 class="welcome-title">ChadAI</h1>
        <p class="welcome-subtitle">
          Your intelligent assistant, everywhere you browse.
        </p>

        <button id="welcome-login-btn" class="welcome-btn primary">
          Sign In
        </button>

        <button id="welcome-register-btn" class="welcome-btn secondary">
          Create Account
        </button>

        <button id="welcome-website-btn" class="welcome-link">
          Visit Website →
        </button>

        <label class="remember-toggle">
          <input type="checkbox" id="remember-me-checkbox" />
          <span class="toggle-text">Remember me</span>
        </label>
      </div>
    </div>

            <img class="head-icon" src="icons/icon.ico" alt="Chad" />
            <h1 class="head-text">ChadAI</h1>
          </div>

          <div class="model-selector">
            <button id="model-btn" class="model-btn">
              <span class="model-name">GPT-4o</span>
              <span class="model-chevron">▾</span>
            </button>
            <div id="model-dropdown" class="model-dropdown">
              <div class="model-option active" data-model="gpt-4o">GPT-4o</div>
              <div class="model-option" data-model="gpt-4o-mini">GPT-4o mini</div>
              <div class="model-option" data-model="gpt-3.5-turbo">GPT-3.5</div>
            </div>
          </div>
        </div>

        <!-- User Avatar -->
        <div class="user-avatar-wrapper">
          <div id="user-avatar" class="user-avatar"></div>

          <div id="user-dropdown" class="user-dropdown">
            <a id="profile-link" class="dropdown-item">
              <img src="icons/profile.png" class="dropdown-icon" />
              Profile
            </a>

            <a id="upgrade-link" class="dropdown-item">
              <img src="icons/star.png" class="dropdown-icon gradient-icon" />
              Upgrade Plan
            </a>
          </div>
        </div>
      </div>
